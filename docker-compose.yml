version: "3"

services:
  mr-nom-server:
    image: hetorusnl/mr-nom-server
    container_name: mr-nom-server
    ports:
      - 1337:1337
    environment:
      - FCM_TOKEN=insert-fcm-token-here
      - PORT=1337
    volumes:
      - /path/to/mr-nom-server/persist:/src/persist

  mr-nom-server-python:
    image: hetorusnl/mr-nom-server-python
    container_name: mr-nom-server-python
    ports:
      - 1338:1338
    environment:
      - FCM_TOKEN=insert-fcm-token-here
      - PORT=1338
    volumes:
      - /path/to/mr-nom-server-python/persist:/src/persist
